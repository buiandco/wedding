<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#234d3c">
<title>Jennifer & Charlie — Wedding Seat Finder</title>
<style>
:root{
  --green:#285a46;
  --green-dark:#183d2f;
  --green-soft:#dfeee6;
  --gold:#b99a5b;
  --cream:#fbfaf6;
  --ink:#24312b;
  --muted:#6d756f;
  --line:rgba(40,90,70,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.95),rgba(255,255,255,0) 45%),
    linear-gradient(135deg,#f8f5ee,#eef3ee);
}
button,input{font:inherit}
.app{width:min(1180px,100%);margin:auto;padding:28px 18px 40px}
.header{text-align:center;margin:4px 0 22px}
.kicker{
  letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:var(--gold);font-weight:700
}
h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(30px,5vw,50px);margin:8px 0 5px;color:var(--green-dark)}
.date{color:var(--muted);font-size:14px}
.search-card{
  width:min(620px,100%);margin:0 auto 22px;background:rgba(255,255,255,.92);
  border:1px solid var(--line);border-radius:22px;padding:14px;
  box-shadow:0 18px 50px rgba(24,61,47,.10);backdrop-filter:blur(12px)
}
.search-wrap{position:relative}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:#7b847e}
#search{
  width:100%;border:1px solid #dfe5e0;border-radius:15px;padding:15px 46px 15px 45px;
  font-size:17px;background:#fff;outline:none;transition:.2s
}
#search:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(40,90,70,.10)}
.clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:0;border-radius:50%;background:#eef2ef;color:#5f6962;cursor:pointer
}
.results{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.result{
  display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:13px;
  background:#f6f8f6;cursor:pointer;border:1px solid transparent;transition:.2s
}
.result:hover{background:var(--green-soft);border-color:#cfe2d7}
.result-name{font-weight:650}.result-table{font-size:13px;color:var(--green);font-weight:700}
.hint{text-align:center;color:#818983;font-size:12px;margin:10px 2px 0}

.map-card{
  background:#fff;border:1px solid var(--line);border-radius:28px;padding:12px;
  box-shadow:0 24px 70px rgba(24,61,47,.13);overflow:hidden
}
.map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 7px 12px}
.map-title{font-family:Georgia,serif;font-size:19px;color:var(--green-dark)}
.map-actions{display:flex;gap:6px}
.map-actions button{
  border:1px solid #dce4df;background:#fff;color:var(--green-dark);border-radius:10px;padding:8px 11px;cursor:pointer
}
.map-actions button:hover{background:#f1f6f2}
.map-viewport{
  position:relative;overflow:hidden;border-radius:20px;background:#f4f1e9;touch-action:none;
  min-height:320px;cursor:grab
}
.map-viewport.dragging{cursor:grabbing}
.map-stage{
  position:absolute;left:0;top:0;width:1402px;height:1122px;transform-origin:0 0;
  user-select:none
}
.map-image{position:absolute;inset:0;width:1402px;height:1122px;display:block}
.overlay{position:absolute;inset:0;width:1402px;height:1122px;overflow:visible}
.route{
  fill:none;stroke:#2c7a58;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:2 22;filter:drop-shadow(0 2px 2px rgba(27,75,52,.18));
  opacity:0;transition:opacity .35s
}
.route.visible{opacity:1;animation:dash 1.1s linear infinite}
.route-shadow{
  fill:none;stroke:rgba(255,255,255,.9);stroke-width:16;stroke-linecap:round;stroke-linejoin:round;opacity:0
}
.route-shadow.visible{opacity:.85}
@keyframes dash{to{stroke-dashoffset:-24}}
.route-dot{fill:#2c7a58;opacity:0}
.route-dot.visible{opacity:1}
.table-hit{fill:rgba(255,255,255,0);stroke:transparent;cursor:pointer}
.halo{
  fill:rgba(64,165,113,.13);stroke:#2c8a5f;stroke-width:7;
  opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none
}
.halo.active{opacity:1;animation:halo 1.7s ease-in-out infinite}
@keyframes halo{
  0%,100%{transform:scale(.92);filter:drop-shadow(0 0 3px rgba(44,138,95,.35))}
  50%{transform:scale(1.10);filter:drop-shadow(0 0 18px rgba(44,138,95,.7))}
}
.table-label{
  opacity:0;pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.table-label.active{opacity:1}
.table-label rect{fill:#285a46;rx:13;filter:drop-shadow(0 4px 7px rgba(0,0,0,.2))}
.table-label text{fill:white;font-size:18px;font-weight:800;text-anchor:middle}
.dance{font-size:27px;opacity:.72;transform-box:fill-box;transform-origin:center;animation:dance 1.25s ease-in-out infinite alternate}
.d2{animation-delay:-.35s}.d3{animation-delay:-.7s}.d4{animation-delay:-.15s}
@keyframes dance{from{transform:translateY(3px) rotate(-5deg)}to{transform:translateY(-5px) rotate(5deg)}}
.entrance-label{
  fill:#285a46;font-size:14px;font-weight:800;letter-spacing:2px;text-anchor:middle;opacity:.85
}
.start-dot{fill:#285a46;stroke:#fff;stroke-width:5;opacity:0}
.start-dot.visible{opacity:1;animation:pulse 1.5s infinite}
@keyframes pulse{50%{r:14}}
.info{
  display:flex;justify-content:center;align-items:center;gap:9px;color:#68736c;font-size:12px;padding:12px 4px 2px
}
.legend-dot{width:8px;height:8px;border-radius:50%;background:#2c8a5f;display:inline-block}
.status{
  margin:0 auto 18px;width:min(620px,100%);display:none;align-items:center;justify-content:center;gap:10px;
  background:#eff7f1;border:1px solid #d4e8da;color:var(--green-dark);border-radius:15px;padding:12px 16px;
}
.status.show{display:flex}
.status strong{font-weight:750}
.status button{border:0;background:none;color:var(--green);font-weight:700;cursor:pointer}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#183d2f;color:#fff;padding:11px 16px;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.2);
  transition:.25s;z-index:20;font-size:13px
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
  .app{padding:18px 10px 28px}
  .map-card{padding:8px;border-radius:20px}
  .map-toolbar{padding:3px 5px 9px}
  .map-title{font-size:16px}
  .map-actions button{padding:7px 9px}
  .map-viewport{height:68vh;min-height:420px;border-radius:15px}
  .info{font-size:11px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="kicker">Welcome to</div>
    <h1>Jennifer &amp; Charlie</h1>
    <div class="date">26 September 2026 · Find your table</div>
  </header>

  <div id="status" class="status">
    <span>✨</span>
    <span id="statusText"></span>
    <button id="statusClear">Clear</button>
  </div>

  <section class="search-card">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" autocomplete="off" placeholder="Search your name…" aria-label="Search your name">
      <button class="clear" id="clearSearch" aria-label="Clear search">×</button>
    </div>
    <div id="results" class="results"></div>
    <div class="hint">Type your first or last name · tap a result · or tap a table on the map</div>
  </section>

  <section class="map-card">
    <div class="map-toolbar">
      <div class="map-title">Reception Floor Plan</div>
      <div class="map-actions">
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="reset" aria-label="Reset map">Reset</button>
        <button id="zoomIn" aria-label="Zoom in">+</button>
      </div>
    </div>

    <div class="map-viewport" id="viewport">
      <div class="map-stage" id="stage">
        <img class="map-image" src="wedding-map.jpeg" alt="Wedding reception floor plan">

        <svg class="overlay" viewBox="0 0 1402 1122" aria-label="Interactive wedding map">
          <path id="routeShadow" class="route-shadow"></path>
          <path id="route" class="route"></path>
          <circle id="startDot" class="start-dot" cx="701" cy="1048" r="9"></circle>

          <!-- Subtle animated dancers -->
          <text class="dance d1" x="665" y="390">💃</text>
          <text class="dance d2" x="700" y="430">🕺</text>
          <text class="dance d3" x="735" y="390">💃</text>
          <text class="dance d4" x="700" y="465">🕺</text>

          <text class="entrance-label" x="701" y="1090">ENTRANCE</text>

          <g id="tables"></g>
        </svg>
      </div>
    </div>
    <div class="info"><span class="legend-dot"></span> Green glow = your table · Animated line = walking route</div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const couple = { first:"Jennifer", second:"Charlie", date:"26 September 2026" };

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ2pieQfwGYu8sURMhnXzEk3372PBBQmSmvuiXqPs7sViOPXaptI-0MJ6AkSjD_3tHyna--57_axu6n/pub?gid=0&single=true&output=csv";

const tablePositions = {
  1:[216,360], 2:[347,360], 3:[478,360],
  4:[216,522], 5:[347,522], 6:[478,522],
  7:[216,675], 8:[347,675], 9:[478,675],
  10:[216,824], 11:[347,824], 12:[478,824],
  13:[937,360], 14:[1067,360], 15:[1201,360],
  16:[937,522], 17:[1067,522], 18:[1201,522],
  19:[937,675], 20:[1067,675], 21:[1201,675],
  22:[937,824], 23:[1067,824]
};

const tablesG = document.getElementById("tables");
const route = document.getElementById("route");
const routeShadow = document.getElementById("routeShadow");
const startDot = document.getElementById("startDot");
const viewport = document.getElementById("viewport");
const stage = document.getElementById("stage");
const search = document.getElementById("search");
const results = document.getElementById("results");
const status = document.getElementById("status");
const statusText = document.getElementById("statusText");
const toast = document.getElementById("toast");

let guests = [];
let selectedTable = null;
let scale = 1;
let tx = 0, ty = 0;
let drag = null;

function normalize(s){
  return String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}

function parseCSV(text){
  const rows=[]; let row=[], cell="", quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c === '"' && quoted && n === '"'){ cell+='"'; i++; continue; }
    if(c === '"'){ quoted=!quoted; continue; }
    if(c === ',' && !quoted){ row.push(cell.trim()); cell=""; continue; }
    if((c === '\n' || c === '\r') && !quoted){
      if(c === '\r' && n === '\n') i++;
      row.push(cell.trim()); cell="";
      if(row.some(v=>v!=="")) rows.push(row);
      row=[]; continue;
    }
    cell+=c;
  }
  row.push(cell.trim());
  if(row.some(v=>v!=="")) rows.push(row);
  return rows;
}

function buildTables(){
  for(const [table, [x,y]] of Object.entries(tablePositions)){
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.dataset.table=table;

    const hit=document.createElementNS("http://www.w3.org/2000/svg","circle");
    hit.setAttribute("class","table-hit");
    hit.setAttribute("cx",x); hit.setAttribute("cy",y); hit.setAttribute("r",64);
    hit.addEventListener("click",()=>selectTable(Number(table), null, true));
    g.appendChild(hit);

    const halo=document.createElementNS("http://www.w3.org/2000/svg","circle");
    halo.setAttribute("class","halo");
    halo.setAttribute("cx",x); halo.setAttribute("cy",y); halo.setAttribute("r",69);
    halo.dataset.halo=table;
    g.appendChild(halo);

    const label=document.createElementNS("http://www.w3.org/2000/svg","g");
    label.setAttribute("class","table-label");
    label.dataset.label=table;
    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x",x-61); rect.setAttribute("y",y-101); rect.setAttribute("width",122); rect.setAttribute("height",32);
    const text=document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x",x); text.setAttribute("y",y-79); text.textContent="YOUR TABLE";
    label.append(rect,text); g.appendChild(label);

    tablesG.appendChild(g);
  }
}
buildTables();

function routePoints(table){
  const [x,y] = tablePositions[table];
  const entrance=[701,1048];

  // Keep the route in the open aisle and travel around the dance floor rather
  // than drawing a straight line through tables/dance floor.
  if(x < 600){
    if(y >= 760) return [entrance,[570,980],[570,y],[x,y]];
    if(y >= 590) return [entrance,[570,980],[570,570],[x,570],[x,y]];
    return [entrance,[570,980],[570,285],[x,285],[x,y]];
  }

  if(x > 800){
    if(y >= 760) return [entrance,[835,980],[835,y],[x,y]];
    if(y >= 590) return [entrance,[835,980],[835,570],[x,570],[x,y]];
    return [entrance,[835,980],[835,285],[x,285],[x,y]];
  }

  return [entrance,[701,930],[701,760],[x,y]];
}

function makePath(points){
  return points.map((p,i)=>(i?"L ":"M ")+p[0]+" "+p[1]).join(" ");
}

function clearSelection(){
  selectedTable=null;
  document.querySelectorAll(".halo").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll(".table-label").forEach(el=>el.classList.remove("active"));
  route.classList.remove("visible"); routeShadow.classList.remove("visible"); startDot.classList.remove("visible");
  status.classList.remove("show");
  results.innerHTML="";
}

function selectTable(table, guest=null, fromMap=false){
  selectedTable=table;
  document.querySelectorAll(".halo").forEach(el=>el.classList.toggle("active", el.dataset.halo==table));
  document.querySelectorAll(".table-label").forEach(el=>el.classList.toggle("active", el.dataset.label==table));

  const d=makePath(routePoints(table));
  route.setAttribute("d",d); routeShadow.setAttribute("d",d);
  route.classList.add("visible"); routeShadow.classList.add("visible"); startDot.classList.add("visible");

  if(guest){
    statusText.innerHTML = `<strong>${escapeHtml(guest.name)}</strong> · Table ${table}`;
    status.classList.add("show");
    search.value = guest.name;
  } else if(fromMap){
    statusText.innerHTML = `<strong>Table ${table}</strong> selected`;
    status.classList.add("show");
    search.value="";
  }

  focusTable(table);
}

function focusTable(table){
  const [x,y]=tablePositions[table];
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const targetScale=Math.max(1, Math.min(1.55, scale < 1 ? 1 : scale));
  scale=targetScale;
  tx=(vw/2)-(x*scale);
  ty=(vh/2)-(y*scale);
  clampPan();
  render();
}

function clampPan(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const sw=1402*scale, sh=1122*scale;
  const minX=Math.min(0,vw-sw), minY=Math.min(0,vh-sh);
  tx=Math.max(minX,Math.min(0,tx));
  ty=Math.max(minY,Math.min(0,ty));
  if(sw<vw) tx=(vw-sw)/2;
  if(sh<vh) ty=(vh-sh)/2;
}
function render(){ stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }

function resetMap(){
  scale=Math.min(viewport.clientWidth/1402, viewport.clientHeight/1122);
  scale=Math.max(scale, .55);
  tx=(viewport.clientWidth-1402*scale)/2;
  ty=(viewport.clientHeight-1122*scale)/2;
  render();
}
function zoom(delta){
  const old=scale;
  scale=Math.max(.55,Math.min(2.0,scale+delta));
  const rect=viewport.getBoundingClientRect();
  const cx=rect.width/2, cy=rect.height/2;
  tx=cx-(cx-tx)*(scale/old);
  ty=cy-(cy-ty)*(scale/old);
  clampPan(); render();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

function renderResults(matches){
  results.innerHTML="";
  matches.slice(0,8).forEach(g=>{
    const div=document.createElement("div");
    div.className="result";
    div.innerHTML=`<span class="result-name">${escapeHtml(g.name)}</span><span class="result-table">TABLE ${escapeHtml(g.table)}</span>`;
    div.addEventListener("click",()=>selectTable(Number(g.table),g));
    results.appendChild(div);
  });
  if(matches.length>8){
    const more=document.createElement("div");
    more.className="hint";
    more.textContent=`${matches.length-8} more matches — keep typing to narrow it down.`;
    results.appendChild(more);
  }
}

search.addEventListener("input",()=>{
  const q=normalize(search.value);
  results.innerHTML="";
  if(!q){ if(!selectedTable) clearSelection(); return; }
  const parts=search.value.trim().split(/\s+/).map(normalize).filter(Boolean);
  const matches=guests.filter(g=>parts.every(p=>g.normalized.includes(p)));
  if(matches.length===1) selectTable(Number(matches[0].table),matches[0]);
  else if(matches.length) renderResults(matches);
  else results.innerHTML=`<div class="hint">No guest found. Try a first name, surname or nickname.</div>`;
});

document.getElementById("clearSearch").onclick=()=>{search.value="";clearSelection();search.focus()};
document.getElementById("statusClear").onclick=()=>{clearSelection();search.value=""};
document.getElementById("reset").onclick=resetMap;
document.getElementById("zoomIn").onclick=()=>zoom(.12);
document.getElementById("zoomOut").onclick=()=>zoom(-.12);

viewport.addEventListener("pointerdown",e=>{
  drag={x:e.clientX,y:e.clientY,tx,ty};
  viewport.classList.add("dragging");
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener("pointermove",e=>{
  if(!drag)return;
  tx=drag.tx+(e.clientX-drag.x); ty=drag.ty+(e.clientY-drag.y);
  clampPan(); render();
});
viewport.addEventListener("pointerup",()=>{drag=null;viewport.classList.remove("dragging")});
viewport.addEventListener("pointercancel",()=>{drag=null;viewport.classList.remove("dragging")});
viewport.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?.08:-.08)},{passive:false});

window.addEventListener("resize",()=>{ if(!selectedTable) resetMap(); else focusTable(selectedTable); });

fetch(CSV_URL)
  .then(r=>{if(!r.ok)throw new Error("CSV unavailable");return r.text()})
  .then(text=>{
    const rows=parseCSV(text).slice(1);
    guests=rows.map(r=>{
      const first=r[0]||"", last=r[1]||"", table=r[2]||"", seat=r[3]||"";
      const name=(first+" "+last).trim();
      return {first,last,table,seat,name,normalized:normalize(name)};
    }).filter(g=>g.name && g.table);
  })
  .catch(()=>{
    // The map remains fully usable even if the Google Sheet is temporarily unavailable.
    showToast("Guest list couldn't be loaded. The map is still available.");
  });

function showToast(msg){
  toast.textContent=msg; toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),3500);
}

resetMap();
</script>
</body>
</html>
